<!-- Travellers 1969 · public follower page · v6 · own site · v13 (with app v218) -->
<style>
:root{--ink:#0D1B2E;--deep:#112240;--card:#162B4A;--line:#2A4E78;--sky:#5BC8F5;--sand:#D8B07A;--text:#F0F8FF;--muted:#8FB3CF;--green:#10B981}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--text);font-family:'Outfit',system-ui,sans-serif}
a{color:var(--sky)}
.top{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;background:rgba(13,27,46,.92);backdrop-filter:blur(8px);border-bottom:1px solid rgba(91,200,245,.18)}
.top img{width:38px;height:38px;border-radius:50%}
.word{font-family:'Dancing Script',cursive;font-size:26px;line-height:1;color:#fff;text-decoration:none;white-space:nowrap}
.word span{color:var(--sky)}
.soc{margin-left:auto;display:flex;gap:6px}
.soc a{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line)}
.soc svg{width:17px;height:17px;fill:var(--text)}
.soc a:hover{border-color:var(--sky)}
/* share */
.soc button.shr{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--sky);border:1px solid var(--sky);cursor:pointer;padding:0}
.soc button.shr svg{fill:var(--ink)}
/* share sheet */
#shOv{position:fixed;inset:0;z-index:3000;background:rgba(4,10,20,.7);display:none;align-items:center;justify-content:center;padding:14px}
#shOv.on{display:flex}
#shBox{position:relative;background:var(--deep);border:1px solid var(--line);border-radius:18px;width:420px;max-width:100%;max-height:92vh;overflow:auto;padding:18px 18px 20px;text-align:center}
#shX{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--deep);color:var(--text);font-size:16px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.5)}
#shBox h3{margin:0 0 4px;font-family:'Dancing Script',cursive;font-size:30px;font-weight:700}
#shBox .sub{color:var(--muted);font-size:13px;margin-bottom:12px}
.shc{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px}
.shc button{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:5px}
.shc button svg{width:14px;height:14px;fill:var(--text)}
.shc button.on{background:var(--sky);border-color:var(--sky);color:var(--ink)}.shc button.on svg{fill:var(--ink)}
#shQr{background:#fff;border-radius:14px;padding:12px;display:inline-block;line-height:0}
#shQr canvas{width:240px;height:240px;max-width:62vw;max-height:62vw}
#shUrl{font-size:13px;color:var(--sky);margin:10px 0 12px;word-break:break-all}
.sha{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.sha button{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 14px;font:inherit;font-size:14px;cursor:pointer}
.sha button.main{background:var(--sky);border-color:var(--sky);color:var(--ink);font-weight:700}
@media (max-width:400px){.top img{width:32px;height:32px}.top{gap:7px;padding-left:10px;padding-right:10px}.word{font-size:20px}.soc{gap:4px}.soc a,.soc button.shr{width:28px;height:28px}.soc svg{width:14px;height:14px}}
/* home */
#home{display:none;padding:calc(env(safe-area-inset-top) + 76px) 16px 40px;max-width:980px;margin:0 auto}
.hero{display:flex;align-items:center;gap:22px;margin:10px 0 26px}
.hero img{width:118px;height:118px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 4px rgba(216,176,122,.35)}
.hero h1{margin:0;font-family:'Dancing Script',cursive;font-size:46px;line-height:1.05;font-weight:700}
.hero p{margin:6px 0 0;color:var(--muted);font-size:16px;line-height:1.5;max-width:46ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.trip{display:block;text-decoration:none;color:var(--text);background:var(--deep);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:border-color .15s}
.trip:hover{border-color:var(--sky)}
.trip svg.mini{display:block;width:100%;height:150px;background:radial-gradient(120% 90% at 30% 20%,#1B3760,#0F213C)}
.trip .b{padding:12px 14px 14px}
.trip h3{margin:0 0 4px;font-size:18px}
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:20px;padding:2px 10px;margin-bottom:6px}
.chip.live{background:rgba(16,185,129,.16);color:#4ADE9F}
.chip.done{background:rgba(91,200,245,.14);color:var(--sky)}
.chip.soon{background:rgba(216,176,122,.18);color:var(--sand)}
.trip .m{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:50px 10px;font-size:16px;line-height:1.6}
/* trip */
#trip{display:none}
#map{position:fixed;top:var(--hdr,62px);bottom:0;left:400px;right:0;background:#0F213C}
#panel{position:fixed;top:0;bottom:0;left:0;width:400px;overflow:auto;padding:calc(env(safe-area-inset-top) + 70px) 18px 30px;background:var(--ink);border-right:1px solid var(--line);z-index:500}
.back{font-size:13px;color:var(--muted);text-decoration:none}
.back:hover{color:var(--sky)}
#panel h2{margin:8px 0 2px;font-size:26px;line-height:1.15}
.dates{color:var(--muted);font-size:13px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0 16px}
.stat{background:var(--deep);border:1px solid var(--line);border-radius:12px;padding:9px 6px;text-align:center}
.stat{display:flex;flex-direction:column;justify-content:center;min-height:64px;padding:10px 8px}
.stat b{display:block;font-size:20px;line-height:1.15;white-space:nowrap}
.stat span{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap}
.here{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,rgba(91,200,245,.16),rgba(216,176,122,.12));border:1px solid rgba(91,200,245,.35);border-radius:14px;padding:12px;margin-bottom:16px;cursor:pointer}
.here img{width:46px;height:46px;border-radius:50%}
.here small{display:block;color:var(--muted);font-size:12px}
.here b{font-size:17px}
h4{margin:18px 0 8px;font-size:13px;color:var(--sand);font-weight:600}
.next{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer}
.num{width:24px;height:24px;border-radius:50%;border:2px solid var(--sand);color:var(--sand);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tl{position:relative;padding-left:20px}
.tl::before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:rgba(91,200,245,.3)}
.st{position:relative;padding:4px 0 14px;cursor:pointer}
.st::before{content:'';position:absolute;left:-19px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--sky);border:2px solid var(--ink)}
.st .n{font-weight:600;font-size:15px}
.st .s{font-size:12px;color:var(--muted)}
.posts{margin-top:6px;display:flex;flex-direction:column;gap:5px}
.post{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text);background:var(--deep);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px}
.post:hover{border-color:var(--sky)}
.post svg{width:16px;height:16px;fill:var(--text);flex-shrink:0}
.post .pd{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap}
.st.hl .n{color:var(--sky)}
.st.hl::before{background:var(--sand);transform:scale(1.25)}
#grab{display:none;position:sticky;top:0;z-index:2;margin:0 -16px 6px;padding:10px 0 8px;background:var(--ink);cursor:grab;touch-action:none;text-align:center}
#grab i{display:inline-block;width:44px;height:5px;border-radius:3px;background:var(--line)}
#grab small{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.tools input,.tools select{background:var(--deep);border:1px solid var(--line);border-radius:9px;color:var(--text);font:inherit;font-size:13px;padding:7px 9px}
.tools input[type=search]{flex:1 1 160px;min-width:0}
.tools label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.cnt{font-size:12px;color:var(--muted);margin:-4px 0 8px}
.foot{margin-top:24px;font-size:12px;color:var(--muted);line-height:1.6}
/* map bits */
.pulse{width:58px;height:58px;position:relative}
.pulse img{position:absolute;inset:6px;width:46px;height:46px;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.45)}
.pulse::before{content:'';position:absolute;inset:0;border-radius:50%;background:rgba(91,200,245,.45);animation:pl 2s ease-out infinite}
@keyframes pl{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){.pulse::before{animation:none}}
.vdot{width:14px;height:14px;border-radius:50%;background:var(--sky);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.ndot.sd,.num.sd{border-color:#F59E0B;color:#F59E0B}.sdl{font-size:12px;color:#F59E0B}
.pvbar{background:#3a2a0b;border:1px solid #F59E0B;color:#FCD34D;border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.4;margin:6px 0 10px}
.ndot{width:24px;height:24px;border-radius:50%;background:#0D1B2E;border:2px solid var(--sand);color:var(--sand);font:700 12px Outfit,sans-serif;display:flex;align-items:center;justify-content:center}
.leaflet-popup-content-wrapper{background:var(--ink);color:var(--text);border-radius:14px;border:1px solid var(--line)}
.leaflet-popup-tip{background:var(--ink)}
.leaflet-popup-content{margin:12px 14px;font-family:Outfit,sans-serif;min-width:200px}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.pp .n{font-weight:700;font-size:15px}.pp .s{font-size:12px;color:var(--muted);margin-bottom:6px}
.leaflet-control-attribution{background:rgba(13,27,46,.75)!important;color:var(--muted)!important}
.leaflet-control-attribution a{color:var(--sky)!important}
/* phone: map on top, panel below as a sheet */
@media (max-width:820px){
  .word{font-size:22px}
  .soc a,.soc button.shr{width:30px;height:30px}.soc svg{width:15px;height:15px}
  #map{left:0;right:0;bottom:0;top:var(--hdr,56px)}
  #panel{top:auto;bottom:0;left:0;right:0;width:auto;height:var(--sheet,46vh);padding:0 16px 30px;border-right:none;border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.45);transition:height .25s ease;overscroll-behavior:contain}
  #panel.drag{transition:none}
  #grab{display:block}
  .hero{flex-direction:column;text-align:center}
  .hero h1{font-size:38px}
}
</style>
</head>
<body>
<header class="top">
  <img src="/pin-travellers.png" alt="Serge & Els">
  <a class="word" href="/">Travellers <span>1969</span></a>
  <nav class="soc" id="soc"></nav>
</header>

<main id="home">
  <section class="hero">
    <img src="/pin-travellers.png" alt="Serge and Els">
    <div><h1>Follow our trips</h1>
    <p>Two Belgians born in 1969, on the road, travelling the world. Pick a trip to see where we've been, where we're heading next, and the posts from every stop.</p></div>
  </section>
  <div class="grid" id="trips"><div class="empty">Loading…</div></div>
</main>

<div id="shOv" role="dialog" aria-modal="true" aria-label="Share Travellers 1969"><div id="shBox">
  <button id="shX" type="button" title="Close" aria-label="Close">✕</button>
  <h3>Share Travellers 1969</h3>
  <div class="sub">Send the link, or let someone scan the code.</div>
  <div class="shc" id="shChips"></div>
  <div id="shQr"></div>
  <div id="shUrl"></div>
  <div class="sha"><button class="main" id="shGo" type="button">📤 Share link</button><button id="shCp" type="button">📋 Copy link</button><button id="shDl" type="button">⬇️ Save QR</button></div>
</div></div>

<main id="trip">
  <div id="map"></div>
  <aside id="panel"><div class="empty">Loading…</div></aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
function setHdr(){var h=document.querySelector('.top');if(h)document.documentElement.style.setProperty('--hdr',h.offsetHeight+'px');}
setHdr();window.addEventListener('resize',function(){setHdr();if(window.map&&map.invalidateSize)map.invalidateSize();});
var SITE_V='v13';
var BASE='https://firestore.googleapis.com/v1/projects/travellers-1969-b3a8e/databases/(default)/documents/public/';
var KEY='AIzaSyAxPJoDENiNy3wA2rFs-MFcJkUwBN1YwK8';
var SOC=[['ig','Instagram','https://www.instagram.com/travellers_1969/'],['tt','TikTok','https://www.tiktok.com/@travellers_1969'],
         ['yt','YouTube','https://www.youtube.com/@Travellers_1969'],['fb','Facebook','https://www.facebook.com/travellers1969/']];
var ICON={
 ig:'<svg viewBox="0 0 24 24"><path d="M12 7a5 5 0 100 10 5 5 0 000-10zm0 8.2a3.2 3.2 0 110-6.4 3.2 3.2 0 010 6.4zM17.3 5.5a1.2 1.2 0 100 2.4 1.2 1.2 0 000-2.4zM16.5 2h-9A5.5 5.5 0 002 7.5v9A5.5 5.5 0 007.5 22h9a5.5 5.5 0 005.5-5.5v-9A5.5 5.5 0 0016.5 2zm3.7 14.5a3.7 3.7 0 01-3.7 3.7h-9a3.7 3.7 0 01-3.7-3.7v-9a3.7 3.7 0 013.7-3.7h9a3.7 3.7 0 013.7 3.7z"/></svg>',

 yt:'<svg viewBox="0 0 24 24"><path d="M21.6 7.2a2.6 2.6 0 00-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4a2.6 2.6 0 00-1.8 1.8C2 8.8 2 12 2 12s0 3.2.4 4.8a2.6 2.6 0 001.8 1.8c1.6.4 7.8.4 7.8.4s6.2 0 7.8-.4a2.6 2.6 0 001.8-1.8c.4-1.6.4-4.8.4-4.8s0-3.2-.4-4.8zM10 15.1V8.9l5.2 3.1z"/></svg>',

var PNAME={ig:'Instagram',tt:'TikTok',yt:'YouTube',fb:'Facebook',web:'Link'};
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function safeUrl(u){u=String(u||'');return /^https:\/\//i.test(u)?u:'#';}
function fmtD(d){if(!d)return '';var x=new Date(d+'T12:00:00');return isNaN(x)?d:x.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function fmtShort(d){if(!d)return '';var x=new Date(d+'T12:00:00');return isNaN(x)?d:x.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function num(n){return (n||0).toLocaleString('en-US');}
var LCACHE={};
function loadC(doc){if(!LCACHE[doc])LCACHE[doc]=load(doc).catch(function(e){delete LCACHE[doc];throw e;});return LCACHE[doc];}
function load(doc){return fetch(BASE+encodeURIComponent(doc)+'?key='+KEY).then(function(r){if(r.status===404)return null;if(!r.ok)throw new Error(r.status);return r.json();})
  .then(function(d){if(!d||!d.fields||!d.fields.json)return null;return JSON.parse(d.fields.json.stringValue);});}

  +'<button class="shr" type="button" id="shBtn" aria-label="Share" title="Share this page / QR codes"><svg viewBox="0 0 24 24"><path d="M18 16a3 3 0 00-2.4 1.2l-6.7-3.4a3 3 0 000-1.6l6.7-3.4A3 3 0 1015 7a3 3 0 00.1.8L8.4 11.2a3 3 0 100 3.6l6.7 3.4A3 3 0 1018 16z"/></svg></button>';
/* ---------- share sheet: link + QR codes (site, this trip, socials) ---------- */
var SH={cur:0,list:[],lib:null};
function shLib(){if(window.qrcode)return Promise.resolve();if(SH.lib)return SH.lib;
  SH.lib=new Promise(function(ok,no){var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s);});return SH.lib;}
function shTargets(){var slug=String(location.pathname||'').replace(/^\/+|\/+$/g,'').split('/')[0],o=[];
  if(/^[a-z0-9-]{1,40}$/.test(slug)){var nm=(document.querySelector('#panel h2')||{}).textContent||'This trip';o.push({k:'trip',l:'This trip',t:nm,u:'https://travellers1969.web.app/'+slug,i:''});}
  o.push({k:'site',l:'All our trips',t:'Travellers 1969',u:'https://travellers1969.web.app',i:''});
  SOC.forEach(function(s){o.push({k:s[0],l:s[1],t:'Travellers 1969 on '+s[1],u:s[2],i:ICON[s[0]]});});return o;}
function shDraw(){var t=SH.list[SH.cur];$('shChips').querySelectorAll('button').forEach(function(b,k){b.classList.toggle('on',k===SH.cur);});
  $('shUrl').textContent=t.u.replace(/^https:\/\//,'');$('shQr').innerHTML='';
  shLib().then(function(){var q=qrcode(0,'H');q.addData(t.u);q.make();var n=q.getModuleCount(),cell=Math.max(4,Math.floor(480/n)),m=cell*2,S=n*cell+2*m;
    var c=document.createElement('canvas');c.width=S;c.height=S;var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,S,S);x.fillStyle='#0D1B2E';
    for(var r=0;r<n;r++)for(var k=0;k<n;k++)if(q.isDark(r,k))x.fillRect(m+k*cell,m+r*cell,cell,cell);
    var lg=new Image();lg.onload=function(){var L=Math.round(S*0.22),p=(S-L)/2;x.fillStyle='#fff';x.beginPath();x.arc(S/2,S/2,L/2+6,0,7);x.fill();
      x.save();x.beginPath();x.arc(S/2,S/2,L/2,0,7);x.clip();x.drawImage(lg,p,p,L,L);x.restore();};lg.src='/pin-travellers.png';
    $('shQr').appendChild(c);SH.canvas=c;}).catch(function(){$('shQr').innerHTML='<div style="color:#0D1B2E;padding:20px;line-height:1.4">QR code needs an internet connection</div>';});}
function shOpen(){SH.list=shTargets();SH.cur=0;
  $('shChips').innerHTML=SH.list.map(function(t,k){return '<button type="button" data-k="'+k+'">'+(t.i||'')+esc(t.l)+'</button>';}).join('');
  $('shChips').querySelectorAll('button').forEach(function(b){b.onclick=function(){SH.cur=+b.getAttribute('data-k');shDraw();};});
  $('shOv').classList.add('on');shDraw();}
function shClose(){$('shOv').classList.remove('on');}
$('shBtn').onclick=shOpen;$('shX').onclick=shClose;
$('shOv').addEventListener('click',function(e){if(e.target===$('shOv'))shClose();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')shClose();});
$('shCp').onclick=function(){var t=SH.list[SH.cur],b=this;(navigator.clipboard?navigator.clipboard.writeText(t.u):Promise.reject()).then(function(){b.textContent='✅ Copied';setTimeout(function(){b.textContent='📋 Copy link';},1600);}).catch(function(){prompt('Copy this link:',t.u);});};
$('shGo').onclick=function(){var t=SH.list[SH.cur];
  if(navigator.share)navigator.share({title:t.t,text:'Follow Serge & Els, two Belgians born in 1969, travelling the world.',url:t.u}).catch(function(){});
  else $('shCp').click();};
$('shDl').onclick=function(){var t=SH.list[SH.cur];if(!SH.canvas)return;var a=document.createElement('a');a.href=SH.canvas.toDataURL('image/png');
  a.download='Travellers1969_QR_'+t.l.replace(/[^A-Za-z0-9]+/g,'_')+'.png';document.body.appendChild(a);a.click();a.remove();};
var CHIP={live:['live','🟢 On the road now'],done:['done','✅ Trip completed'],soon:['soon','🔜 Coming soon']};
function dateRange(t){if(t.status==='soon')return 'Starting soon';if(t.status==='live')return 'Since '+fmtD(t.from);return fmtD(t.from)+' – '+fmtD(t.to);}

/* ---------- home: all published trips ---------- */
function miniSvg(line){if(!line||line.length<2)return '<svg class="mini"></svg>';
  var a=90,b=180,c=-90,d=-180;line.forEach(function(p){a=Math.min(a,p[0]);c=Math.max(c,p[0]);b=Math.min(b,p[1]);d=Math.max(d,p[1]);});
  var W=300,H=150,pad=18,k=Math.cos((a+c)/2*Math.PI/180),w=(d-b)*k||1,h=(c-a)||1,s=Math.min((W-2*pad)/w,(H-2*pad)/h);
  var ox=(W-w*s)/2,oy=(H-h*s)/2;
  var pts=line.map(function(p){return (ox+(p[1]-b)*k*s).toFixed(1)+','+(oy+(c-p[0])*s).toFixed(1);});
  var last=pts[pts.length-1].split(','),first=pts[0].split(',');
  return '<svg class="mini" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" aria-hidden="true">'
   +'<polyline points="'+pts.join(' ')+'" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>'
   +'<polyline points="'+pts.join(' ')+'" fill="none" stroke="#5BC8F5" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>'
   +'<circle cx="'+first[0]+'" cy="'+first[1]+'" r="4.5" fill="#D8B07A"/><circle cx="'+last[0]+'" cy="'+last[1]+'" r="4.5" fill="#fff" stroke="#5BC8F5" stroke-width="2"/></svg>';}
function showHome(){$('home').style.display='block';
  load('index').then(function(list){list=(list||[]).filter(function(t){return t&&t.slug;});
    if(!list.length){$('trips').innerHTML='<div class="empty">No trips shared yet — follow us on the socials above and check back soon.</div>';return;}
    var rank={live:0,soon:1,done:2};
    list.sort(function(x,y){return (rank[x.status]-rank[y.status])||String(y.from||'').localeCompare(String(x.from||''));});
    $('trips').innerHTML=list.map(function(t){var c=CHIP[t.status]||CHIP.soon,s=t.stats||{};
      return '<a class="trip" href="/'+encodeURIComponent(t.slug)+'">'+miniSvg(t.line)+'<div class="b"><span class="chip '+c[0]+'">'+c[1]+'</span>'
        +'<h3>'+esc(t.name)+'</h3><div class="m">'+esc(dateRange(t))+'</div>'
        +'<div class="m" style="margin-top:4px">'+(s.visited||0)+' of '+(s.total||0)+' stops'+(s.km?(' · '+num(s.km)+' km'):'')+(s.states?(' · '+s.states+' state'+(s.states===1?'':'s')):'')+'</div></div></a>';}).join('');
    $('trips').querySelectorAll('a.trip').forEach(function(a){var sl=decodeURIComponent(a.getAttribute('href').slice(1));
      var pre=function(){loadC(sl).catch(function(){});};a.addEventListener('mouseenter',pre);a.addEventListener('touchstart',pre,{passive:true});
      a.addEventListener('click',function(e){if(e.metaKey||e.ctrlKey||e.shiftKey||e.button)return;e.preventDefault();
        history.pushState({trip:sl},'','/'+encodeURIComponent(sl));$('home').style.display='none';window.scrollTo(0,0);showTrip(sl);});});
    /* most visitors open the newest trip: fetch it in the background */
    setTimeout(function(){if(list[0])loadC(list[0].slug).catch(function(){});},400);
  }).catch(function(){$('trips').innerHTML='<div class="empty">Could not load the trips. Please try again in a moment.</div>';});}

/* ---------- one trip ---------- */
var map,marks=[];
function divIcon(html,size){return L.divIcon({html:html,className:'',iconSize:[size,size],iconAnchor:[size/2,size/2],popupAnchor:[0,-size/2]});}
function postsHtml(p){if(!p||!p.length)return '';
  return '<div class="posts">'+p.slice().sort(function(a,b){return String(b.d||'').localeCompare(String(a.d||''));}).map(function(x){
    return '<a class="post" href="'+esc(safeUrl(x.u))+'" target="_blank" rel="noopener">'+(ICON[x.t]||ICON.web)+'<span>'+esc(x.l||PNAME[x.t]||'Post')+'</span><span class="pd">'+esc(fmtShort(x.d))+'</span></a>';}).join('')+'</div>';}
function showTrip(slug){$('trip').style.display='block';
  map=L.map('map',{zoomControl:true,attributionControl:true,worldCopyJump:true}).setView([44,-100],4);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
  loadC(slug).then(function(t){
    if(!t){$('panel').innerHTML='<a class="back" href="/">← All trips</a><div class="empty">This trip isn’t shared (any more).<br><a href="/">See our other trips</a></div>';return;}
    document.title=t.name+' · Travellers 1969';
    var s=t.stats||{},c=CHIP[t.status]||CHIP.soon;
    if(t.ahead&&t.ahead.length>1){L.polyline(t.ahead,{color:'#ffffff',weight:7,opacity:.8}).addTo(map);
      L.polyline(t.ahead,{color:'#1D4ED8',weight:4,opacity:.95,dashArray:'8 8'}).addTo(map);}
    /* side trips from a base stay: dotted, green once visited */
    (t.side||[]).forEach(function(q){var ll=Array.isArray(q)?[[q[0],q[1]],[q[2],q[3]]]:(q.g||[]),v=Array.isArray(q)?q[4]:q.v;if(ll.length<2)return;
      L.polyline(ll,{color:'#ffffff',weight:6,opacity:.75,interactive:false}).addTo(map);
      L.polyline(ll,{color:v?'#10B981':'#F59E0B',weight:3.5,opacity:1,dashArray:'1 8',lineCap:'round',interactive:false}).addTo(map);});
    if(t.done&&t.done.length>1){L.polyline(t.done,{color:'#ffffff',weight:9,opacity:.95}).addTo(map);
      L.polyline(t.done,{color:'#10B981',weight:6,opacity:1}).addTo(map);}
    var byKey={};
    (t.visited||[]).forEach(function(v,k){
      var m=L.marker([v.a,v.o],{icon:divIcon('<div class="vdot"></div>',14),keyboard:false}).addTo(map)
        .bindPopup('<div class="pp"><div class="n">'+esc(v.n)+'</div><div class="s">'+esc(v.s)+(v.d?(' · '+esc(fmtD(v.d))):'')+'</div>'+(v.p&&v.p.length?postsHtml(v.p):'<div class="s">Posts coming soon</div>')+'</div>',{maxWidth:280});
      byKey['v'+k]=m;});
    (t.next||[]).forEach(function(n,k){
      var m=L.marker([n.a,n.o],{icon:divIcon('<div class="ndot'+(n.sd?' sd':'')+'">'+(k+1)+'</div>',24)}).addTo(map)
        .bindPopup('<div class="pp"><div class="n">'+esc(n.n)+'</div><div class="s">'+esc(n.s)+' · coming up'+(n.sd?(' · '+(n.sd===2?'where we stay in ':'side trip from ')+esc(n.b||'')):'')+'</div></div>');
      byKey['n'+k]=m;});
    if(t.here){byKey.here=L.marker([t.here.a,t.here.o],{icon:divIcon('<div class="pulse"><img src="/pin-travellers.png" alt=""></div>',58),zIndexOffset:1000}).addTo(map)
      .bindPopup('<div class="pp"><div class="n">'+(t.status==='done'?'Last stop':'We’re here')+'</div><div class="s">'+esc(t.here.n)+', '+esc(t.here.s)+'</div></div>');}
    if(t.bbox)map.fitBounds([[t.bbox[0],t.bbox[1]],[t.bbox[2],t.bbox[3]]],{padding:[30,30]});
    var mi=Math.round((s.km||0)/1.609344);
    if(t.preview){var mr=document.createElement('meta');mr.name='robots';mr.content='noindex,nofollow';document.head.appendChild(mr);document.title='Preview · '+document.title;}
    var h=(t.preview?'<div class="pvbar">👁 <b>Preview</b> — only people with this link can see it. Followers don’t see this page; it’s updated when you press Preview in the planner.</div>':'')
      +'<a class="back" href="/">← All trips</a><h2>'+esc(t.name)+'</h2>'
      +'<span class="chip '+c[0]+'">'+c[1]+'</span><div class="dates">'+esc(dateRange(t))+'</div>'
      +(function(){var done=t.status==='done',left=s.kmLeft||0,posts=0;(t.visited||[]).forEach(function(v){posts+=(v.p||[]).length;});
        function tile(big,small){return '<div class="stat"><b>'+big+'</b><span>'+small+'</span></div>';}
        return '<div class="stats">'
          +tile(num(s.days)+' '+(s.days===1?'day':'days'),done?'travelled':'on the road')
          +tile(num(s.km)+' km',num(mi)+' mi driven')
          +(done?tile(num(s.visited)+' stops','all visited'):tile(num(left)+' km',num(Math.round(left/1.609344))+' mi to go'))
          +(done?tile(num(posts)+' '+(posts===1?'post':'posts'),'on our socials'):tile(num(s.visited)+'/'+num(s.total)+' stops',num(Math.max(0,s.total-s.visited))+' to go'))
          +'</div>';})();
    if(t.here&&t.status!=='done')h+='<div class="here" data-k="here"><img src="/pin-travellers.png" alt=""><div><small>'+(t.status==='done'?'Last stop':'We’re here')+'</small><b>'+esc(t.here.n)+'</b><small>'+esc(t.here.s)+'</small></div></div>';
    if(t.next&&t.next.length)h+='<h4>Coming up</h4>'+t.next.map(function(n,k){return '<div class="next" data-k="n'+k+'"><span class="num'+(n.sd?' sd':'')+'">'+(k+1)+'</span><span>'+esc(n.n)+' <span style="color:var(--muted);font-size:12px">'+esc(n.s)+'</span>'+(n.sd?('<br><span class="sdl">'+(n.sd===2?'🏨 where we stay in ':'↳ side trip from ')+esc(n.b||'')+'</span>'):'')+'</span></div>';}).join('');
    var vis=(t.visited||[]).map(function(v,k){return {v:v,k:k};});
    if(vis.length){h+='<h4>Where we\u2019ve been</h4>';
      if(vis.length>6){
        h+='<div class="tools"><input type="search" id="q" placeholder="Search a place\u2026" aria-label="Search a place">'
          +'<label><input type="checkbox" id="wp"> With posts</label></div><div class="cnt" id="cnt"></div>';}
      h+='<div class="tl" id="tl"></div>';}
    else if(t.status==='soon')h+='<div class="empty" style="padding:24px 0">The trip hasn’t started yet. The dashed line is the plan — follow us to see it come alive.</div>';
    h+='<div class="foot">Updated '+esc(new Date(t.updated).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}))+' \u00b7 site '+SITE_V+'<br>Follow along on '
      +SOC.map(function(x){return '<a href="'+x[2]+'" target="_blank" rel="noopener">'+x[1]+'</a>';}).join(' · ')+'</div>';
    $('panel').innerHTML='<div id="grab"><i></i><small id="grabT">Swipe up for the list</small></div>'+h;
    function stHtml(o){var v=o.v;return '<div class="st" data-k="v'+o.k+'"><div class="n">'+esc(v.n)+'</div><div class="s">'+esc(v.s)+(v.d?(' \u00b7 '+esc(fmtD(v.d))):'')
      +(v.p&&v.p.length?(' \u00b7 '+v.p.length+' post'+(v.p.length===1?'':'s')):'')+'</div>'+postsHtml(v.p)+'</div>';}
    function drawTL(){var tl=$('tl');if(!tl)return;var q=($('q')&&$('q').value||'').trim().toLowerCase(),fs=$('fs')?$('fs').value:'',
        wp=$('wp')&&$('wp').checked;
      var L=vis.filter(function(o){return (!q||(o.v.n+' '+o.v.s).toLowerCase().indexOf(q)>=0)&&(!fs||o.v.s===fs)&&(!wp||(o.v.p&&o.v.p.length));});
      tl.innerHTML=L.length?L.map(stHtml).join(''):'<div class="cnt">Nothing matches.</div>';
      if($('cnt'))$('cnt').textContent=L.length+' of '+vis.length+' places';
      bindRows(tl);}
    ['q','fs','so','wp'].forEach(function(id){var e=$(id);if(e)e.addEventListener(id==='q'?'input':'change',drawTL);});
    function bindRows(root){root.querySelectorAll('[data-k]').forEach(function(el){if(el._b)return;el._b=1;el.addEventListener('click',function(e){
      if(e.target.closest('a'))return;var m=byKey[el.getAttribute('data-k')];if(!m)return;
      if(isPhone())setSheet('peek');
      var ll=m.getLatLng(),z=Math.max(map.getZoom(),9),far=map.getCenter().distanceTo(ll)>400000;
      if(map.getCenter().distanceTo(ll)<20&&map.getZoom()===z){m.openPopup();return;}
      map.once('moveend',function(){m.openPopup();});
      if(far)map.setView(ll,z,{animate:false});else map.flyTo(ll,z,{duration:.45});});});}
    bindRows($('panel'));drawTL();
    Object.keys(byKey).forEach(function(k){byKey[k].on('popupopen',function(){
      document.querySelectorAll('.st.hl').forEach(function(x){x.classList.remove('hl');});
      var el=document.querySelector('.st[data-k="'+k+'"]')||document.querySelector('[data-k="'+k+'"]');if(!el)return;if(el.classList.contains('st'))el.classList.add('hl');
      if(!isPhone())el.scrollIntoView({behavior:'smooth',block:'center'});});});
    initSheet();
  }).catch(function(){$('panel').innerHTML='<a class="back" href="/">← All trips</a><div class="empty">Could not load this trip. Please try again in a moment.</div>';});}

function isPhone(){return window.innerWidth<=820;}
var SHEET={peek:118,half:0.46},sheetState='half';
function sheetPx(st){var vh=window.innerHeight,top=(document.querySelector('.top')||{}).offsetHeight||56;
  if(st==='peek')return SHEET.peek;if(st==='full')return Math.round(vh-top-8);return Math.round(vh*SHEET.half);}
function setSheet(st){if(!isPhone())return;sheetState=st;var p=$('panel');p.style.setProperty('--sheet',sheetPx(st)+'px');
  if(st!=='full')p.scrollTop=0;var g=$('grabT');if(g)g.textContent=st==='peek'?'Swipe up for the list':(st==='half'?'Swipe up for more \u00b7 down for the map':'Swipe down for the map');}
function initSheet(){var p=$('panel'),g=$('grab');if(!p||!g)return;if(isPhone())setSheet('half');
  var y0=0,h0=0,moved=false;
  g.addEventListener('click',function(){if(moved)return;setSheet(sheetState==='peek'?'half':(sheetState==='half'?'full':'peek'));});
  g.addEventListener('touchstart',function(e){y0=e.touches[0].clientY;h0=p.offsetHeight;moved=false;p.classList.add('drag');},{passive:true});
  g.addEventListener('touchmove',function(e){var dy=y0-e.touches[0].clientY;if(Math.abs(dy)>6)moved=true;
    p.style.setProperty('--sheet',Math.max(SHEET.peek,Math.min(sheetPx('full'),h0+dy))+'px');},{passive:true});
  g.addEventListener('touchend',function(){p.classList.remove('drag');if(!moved)return;var h=p.offsetHeight,best='half',bd=1e9;
    ['peek','half','full'].forEach(function(s2){var d=Math.abs(sheetPx(s2)-h);if(d<bd){bd=d;best=s2;}});setSheet(best);setTimeout(function(){moved=false;},50);});
  if(window.map&&map.on)map.on('dragstart',function(){if(isPhone()&&sheetState!=='peek')setSheet('peek');});
  window.addEventListener('resize',function(){if(isPhone())setSheet(sheetState);else p.style.removeProperty('--sheet');});}
var parts=location.pathname.replace(/\/+$/,'').split('/').filter(Boolean);
var slug=(parts[0]==='follow'?parts[1]:parts[0])||new URLSearchParams(location.search).get('trip')||'';
try{slug=decodeURIComponent(slug);}catch(e){slug='';}
if(slug&&/^[a-z0-9-]{1,40}$/.test(slug))showTrip(slug);else showHome();
window.addEventListener('popstate',function(){location.reload();});
</script>
